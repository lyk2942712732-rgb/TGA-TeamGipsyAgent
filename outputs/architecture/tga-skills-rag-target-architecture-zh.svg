<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="2500" viewBox="0 0 4000 2500" role="img" aria-labelledby="title desc">
  <title id="title">TGA 引入 Skills 与 RAG 后的目标架构</title>
  <desc id="desc">展示 Skills 方法编排、RAG 知识与证据检索如何接入现有受治理 ReAct Runtime，并保持工具授权、证据归属和完成校验边界。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#f2f7f5"/></linearGradient>
    <marker id="blueArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13Z" fill="#2468d9"/></marker>
    <marker id="greenArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13Z" fill="#0b8a6c"/></marker>
    <marker id="orangeArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13Z" fill="#c4780d"/></marker>
    <marker id="grayArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13Z" fill="#6e8192"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC','Segoe UI',sans-serif;letter-spacing:0}
      .title{font-size:62px;font-weight:800;fill:#163452}.subtitle{font-size:25px;font-weight:500;fill:#5a7187}
      .lane-title{font-size:34px;font-weight:800;fill:#1b4f86}.lane-title-green{font-size:34px;font-weight:800;fill:#12634f}.lane-note{font-size:21px;font-weight:500;fill:#657b8d}
      .node-title{font-size:32px;font-weight:800;fill:#173f6b}.node-title-green{font-size:32px;font-weight:800;fill:#125c4c}.node-title-orange{font-size:32px;font-weight:800;fill:#875407}
      .class-name{font-size:18px;font-weight:650;fill:#74879a}.body{font-size:22px;font-weight:500;fill:#34536c}.body-green{font-size:22px;font-weight:500;fill:#315f55}.body-small{font-size:19px;font-weight:500;fill:#597186}
      .io-label{font-size:19px;font-weight:800;fill:#1e527f}.io-label-green{font-size:19px;font-weight:800;fill:#12725d}.io-label-orange{font-size:19px;font-weight:800;fill:#985b08}
      .edge{font-size:20px;font-weight:800;fill:#205b9b}.edge-green{font-size:20px;font-weight:800;fill:#0d755e}.edge-orange{font-size:20px;font-weight:800;fill:#9c5c06}.edge-gray{font-size:19px;font-weight:800;fill:#607485}
      .badge{font-size:18px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}.status{font-size:17px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .frame{fill:#f7fbff;stroke:#bfd3e8;stroke-width:3;rx:24}.frame-green{fill:#f5fbf8;stroke:#b8d9cd;stroke-width:3;rx:24}.frame-orange{fill:#fffcf6;stroke:#dfc080;stroke-width:3;rx:24}
      .card{fill:#fff;stroke:#c6d8e8;stroke-width:2.5;rx:18}.card-blue{fill:#fafdff;stroke:#9fc3e9;stroke-width:3;rx:18}.card-green{fill:#fbfffd;stroke:#9ed1c0;stroke-width:3;rx:18}.card-orange{fill:#fffcf5;stroke:#e4c27f;stroke-width:3;rx:18}.card-purple{fill:#fdfbff;stroke:#cdbde8;stroke-width:3;rx:18}
      .input-box{fill:#eef5fd;stroke:#c8ddef;stroke-width:1.5;rx:10}.output-box{fill:#eaf8f3;stroke:#b9dfd2;stroke-width:1.5;rx:10}.orange-box{fill:#fff3dc;stroke:#e8cb91;stroke-width:1.5;rx:10}.neutral-box{fill:#f3f6f8;stroke:#cdd8df;stroke-width:1.5;rx:10}
      .flow{fill:none;stroke:#2468d9;stroke-width:5;marker-end:url(#blueArrow)}.flow-green{fill:none;stroke:#0b8a6c;stroke-width:5;marker-end:url(#greenArrow)}.flow-orange{fill:none;stroke:#c4780d;stroke-width:5;marker-end:url(#orangeArrow)}.flow-gray{fill:none;stroke:#6e8192;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#grayArrow)}
      .divider{stroke:#d7e4ee;stroke-width:2}.chip-existing{fill:#2672c7}.chip-new{fill:#0b8a6c}.chip-boundary{fill:#c4780d}
    </style>
  </defs>

  <rect width="4000" height="2500" fill="url(#page)"/>
  <text x="120" y="92" class="title">TGA：引入 Skills 与 RAG 后的目标架构</text>
  <text x="124" y="139" class="subtitle">规划态架构 · Skill 提供可复用方法，RAG 提供带来源的相关知识，二者只增强模型上下文，不扩大授权，也不能替代真实证据</text>
  <g transform="translate(3000 58)"><rect width="840" height="82" rx="16" fill="#fff" stroke="#d2dfe7" stroke-width="2"/><rect x="24" y="20" width="92" height="34" rx="9" class="chip-existing"/><text x="70" y="37" class="status">已有基础</text><rect x="205" y="20" width="92" height="34" rx="9" class="chip-new"/><text x="251" y="37" class="status">建议新增</text><rect x="386" y="20" width="92" height="34" rx="9" class="chip-boundary"/><text x="432" y="37" class="status">治理边界</text><text x="520" y="43" class="body-small">实线：主流程　虚线：增量回流</text></g>

  <!-- A. 内容准备面 -->
  <rect x="100" y="190" width="3800" height="520" class="frame-green"/>
  <text x="145" y="248" class="lane-title-green">A. 内容准备面：把方法和知识变成可检索、可审计的内容</text>
  <text x="145" y="283" class="lane-note">Skill 与知识库由运营/开发人员管理；任务运行时只读取已验证的版本快照。</text>

  <rect x="150" y="330" width="720" height="305" class="card-blue"/>
  <rect x="185" y="357" width="92" height="32" rx="8" class="chip-existing"/><text x="231" y="373" class="status">已有基础</text>
  <text x="185" y="430" class="node-title">Skill 内容库</text><text x="185" y="463" class="class-name">内置 Markdown + 自定义 Markdown</text>
  <text x="185" y="507" class="body">包含：适用场景、标签、所需能力、版本、方法步骤</text>
  <text x="185" y="544" class="body">用途：告诉 Agent “何时使用、按什么步骤验证”</text>
  <rect x="185" y="573" width="640" height="38" class="orange-box"/><text x="205" y="598" class="io-label-orange">不是工具、不是权限、不是事实证据</text>

  <path d="M870 480 H1010" class="flow-green"/><text x="892" y="455" class="edge-green">校验并发布</text>

  <rect x="1010" y="330" width="760" height="305" class="card-green"/>
  <rect x="1045" y="357" width="92" height="32" rx="8" class="chip-new"/><text x="1091" y="373" class="status">建议新增</text>
  <text x="1045" y="430" class="node-title-green">Skill 注册与索引服务</text><text x="1045" y="463" class="class-name">SkillRegistry + SkillSelector</text>
  <text x="1045" y="507" class="body-green">校验：格式、版本、能力名称、场景兼容性</text>
  <text x="1045" y="544" class="body-green">索引：场景、标签、任务阶段、证据条件、成本</text>
  <text x="1045" y="581" class="body-green">输出：不可变 Skill 版本快照和候选列表</text>

  <rect x="1900" y="330" width="760" height="305" class="card"/>
  <rect x="1935" y="357" width="92" height="32" rx="8" class="chip-existing"/><text x="1981" y="373" class="status">已有基础</text>
  <text x="1935" y="430" class="node-title">知识与证据来源</text><text x="1935" y="463" class="class-name">任务输入 · Artifact · 报告 · 可信公共知识</text>
  <text x="1935" y="507" class="body">任务私有：附件、工具结果、HTTP 正文、历史证据</text>
  <text x="1935" y="544" class="body">全局知识：规范、产品文档、团队经验、通用手册</text>
  <rect x="1935" y="573" width="680" height="38" class="orange-box"/><text x="1955" y="598" class="io-label-orange">原始 Artifact 始终是权威事实源</text>

  <path d="M2660 480 H2790" class="flow-green"/><text x="2675" y="455" class="edge-green">解析与索引</text>

  <rect x="2790" y="330" width="960" height="305" class="card-green"/>
  <rect x="2825" y="357" width="92" height="32" rx="8" class="chip-new"/><text x="2871" y="373" class="status">建议新增</text>
  <text x="2825" y="430" class="node-title-green">RAG 摄取与索引流水线</text><text x="2825" y="463" class="class-name">解析 → 分块 → 元数据 → Embedding → 索引</text>
  <text x="2825" y="507" class="body-green">为每个片段绑定：来源、任务归属、权限、时间、哈希</text>
  <text x="2825" y="544" class="body-green">双索引：任务私有索引 + 全局只读知识索引</text>
  <text x="2825" y="581" class="body-green">存储：关键词倒排索引 + 向量索引 + 原文引用</text>

  <!-- B. 会话初始化 -->
  <rect x="100" y="750" width="3800" height="390" class="frame"/>
  <text x="145" y="808" class="lane-title">B. 会话初始化：选择方法，并冻结任务可见范围</text>
  <text x="145" y="843" class="lane-note">Skill 在任务启动时选出基础集合；每轮可在该集合内动态激活。RAG 的检索权限在创建 Session 时冻结。</text>

  <rect x="150" y="890" width="720" height="190" class="card-blue"/>
  <text x="190" y="940" class="node-title">用户任务与执行策略</text><text x="190" y="972" class="class-name">目标、场景、附件、授权范围</text>
  <text x="190" y="1017" class="body">输出：Task、Session、输入清单、MCP 快照</text>

  <path d="M870 985 H1010" class="flow"/><text x="890" y="960" class="edge">任务画像</text>

  <rect x="1010" y="890" width="960" height="190" class="card-green"/>
  <rect x="1045" y="915" width="92" height="32" rx="8" class="chip-new"/><text x="1091" y="931" class="status">建议新增</text>
  <text x="1160" y="942" class="node-title-green">Skill 编排器</text><text x="1160" y="975" class="class-name">按场景 + 标签 + 当前阶段 + 可用能力选择</text>
  <text x="1045" y="1023" class="body-green">输出：已选 Skill ID/版本、适用条件、步骤摘要、允许引用的能力名</text>

  <path d="M1970 985 H2110" class="flow-green"/><text x="1987" y="960" class="edge-green">Skill 快照</text>

  <rect x="2110" y="890" width="760" height="190" class="card-orange"/>
  <rect x="2145" y="915" width="92" height="32" rx="8" class="chip-boundary"/><text x="2191" y="931" class="status">治理边界</text>
  <text x="2260" y="942" class="node-title-orange">会话授权快照</text><text x="2260" y="975" class="class-name">Session Scope Snapshot</text>
  <text x="2145" y="1023" class="body">冻结：任务私有数据范围、全局知识版本、MCP/工具授权</text>

  <path d="M2870 985 H3010" class="flow"/><text x="2890" y="960" class="edge">会话上下文</text>

  <rect x="3010" y="890" width="740" height="190" class="card-blue"/>
  <text x="3050" y="940" class="node-title">持久 Session</text><text x="3050" y="972" class="class-name">Manager · Coordinator · Transcript</text>
  <text x="3050" y="1017" class="body">保存 Skill/RAG 快照并启动受治理 ReAct 循环</text>

  <path d="M1390 635 V875" class="flow-gray"/><text x="1410" y="750" class="edge-gray">候选 Skill 与版本</text>

  <!-- C. 在线 ReAct -->
  <rect x="100" y="1180" width="3800" height="790" class="frame"/>
  <text x="145" y="1238" class="lane-title">C. 每轮 ReAct：先选方法、再检索、后决策，真实动作仍走原治理链</text>
  <text x="145" y="1273" class="lane-note">Skill 和 RAG 只进入 Context Builder；LLM 的工具调用仍必须经过 Dispatcher、Policy、审批和完成校验。</text>

  <rect x="150" y="1320" width="610" height="300" class="card-green"/>
  <circle cx="200" cy="1370" r="25" fill="#0b8a6c"/><text x="200" y="1370" class="badge">1</text>
  <text x="245" y="1380" class="node-title-green">动态激活 Skill</text><text x="190" y="1420" class="class-name">Skill Orchestrator</text>
  <rect x="190" y="1450" width="530" height="62" class="input-box"/><text x="210" y="1488" class="io-label">输入</text><text x="275" y="1488" class="body-small">任务阶段、策略步骤、最近失败</text>
  <rect x="190" y="1528" width="530" height="62" class="output-box"/><text x="210" y="1566" class="io-label-green">输出</text><text x="275" y="1566" class="body-small">本轮方法步骤与使用条件</text>

  <path d="M760 1470 H880" class="flow-green"/><text x="775" y="1446" class="edge-green">方法约束</text>

  <rect x="880" y="1320" width="650" height="300" class="card-green"/>
  <circle cx="930" cy="1370" r="25" fill="#0b8a6c"/><text x="930" y="1370" class="badge">2</text>
  <text x="975" y="1380" class="node-title-green">生成检索计划</text><text x="920" y="1420" class="class-name">Retrieval Planner</text>
  <rect x="920" y="1450" width="570" height="62" class="input-box"/><text x="940" y="1488" class="io-label">输入</text><text x="1005" y="1488" class="body-small">目标、Skill、策略、记忆、对话</text>
  <rect x="920" y="1528" width="570" height="62" class="output-box"/><text x="940" y="1566" class="io-label-green">输出</text><text x="1005" y="1566" class="body-small">查询、过滤条件、Top-K、预算</text>

  <path d="M1530 1470 H1650" class="flow-green"/><text x="1545" y="1446" class="edge-green">检索请求</text>

  <rect x="1650" y="1320" width="760" height="300" class="card-orange"/>
  <circle cx="1700" cy="1370" r="25" fill="#c4780d"/><text x="1700" y="1370" class="badge">3</text>
  <text x="1745" y="1380" class="node-title-orange">混合检索与安全过滤</text><text x="1690" y="1420" class="class-name">关键词 + 向量召回 → 权限过滤 → 重排</text>
  <rect x="1690" y="1450" width="680" height="62" class="orange-box"/><text x="1710" y="1488" class="io-label-orange">边界</text><text x="1780" y="1488" class="body-small">task_id/ACL 先过滤，再打分与重排</text>
  <rect x="1690" y="1528" width="680" height="62" class="output-box"/><text x="1710" y="1566" class="io-label-green">输出</text><text x="1780" y="1566" class="body-small">去重片段、相关度、稳定来源引用</text>

  <path d="M3270 635 V1160 H2200 V1305" class="flow-gray"/><text x="2780" y="1145" class="edge-gray">关键词索引 + 向量索引 + 来源元数据</text>

  <path d="M2410 1470 H2530" class="flow-green"/><text x="2423" y="1446" class="edge-green">引用片段</text>

  <rect x="2530" y="1320" width="650" height="300" class="card-blue"/>
  <circle cx="2580" cy="1370" r="25" fill="#2468d9"/><text x="2580" y="1370" class="badge">4</text>
  <text x="2625" y="1380" class="node-title">组装工作上下文</text><text x="2570" y="1420" class="class-name">Context Builder</text>
  <rect x="2570" y="1450" width="570" height="62" class="input-box"/><text x="2590" y="1488" class="io-label">输入</text><text x="2655" y="1488" class="body-small">Skill 摘要 + RAG 片段 + 对话</text>
  <rect x="2570" y="1528" width="570" height="62" class="output-box"/><text x="2590" y="1566" class="io-label-green">输出</text><text x="2655" y="1566" class="body-small">有 Token 上限、带引用的上下文</text>

  <path d="M3180 1470 H3300" class="flow"/><text x="3195" y="1446" class="edge">增强上下文</text>

  <rect x="3300" y="1320" width="450" height="300" class="card-purple"/>
  <circle cx="3350" cy="1370" r="25" fill="#6648b5"/><text x="3350" y="1370" class="badge">5</text>
  <text x="3395" y="1380" class="node-title">LLM 决策</text><text x="3340" y="1420" class="class-name">文本 + tool_calls</text>
  <text x="3340" y="1470" class="body">Skill：指导怎么做</text>
  <text x="3340" y="1510" class="body">RAG：提供相关材料</text>
  <text x="3340" y="1550" class="body">输出：下一步工具意图</text>

  <!-- 原治理执行链 -->
  <path d="M3525 1620 V1690" class="flow"/><text x="3545" y="1662" class="edge">工具意图</text>
  <rect x="2820" y="1690" width="930" height="205" class="card-orange"/>
  <rect x="2855" y="1715" width="92" height="32" rx="8" class="chip-boundary"/><text x="2901" y="1731" class="status">治理边界</text>
  <text x="2975" y="1744" class="node-title-orange">工具路由、授权、审批、完成校验</text>
  <text x="2855" y="1790" class="body">Dispatcher → Handler → Policy → Observer / Completion Gate</text>
  <text x="2855" y="1830" class="body">Skill 声明的 capability 仅用于匹配，不会授予工具权限</text>
  <text x="2855" y="1864" class="body">检索内容按“不可信数据”处理，完成结论仍需 task-owned Artifact</text>

  <path d="M2820 1795 H2690" class="flow-orange"/><text x="2705" y="1770" class="edge-orange">授权动作</text>
  <rect x="1870" y="1690" width="820" height="205" class="card-green"/>
  <text x="1910" y="1744" class="node-title-green">真实执行与证据固化</text><text x="1910" y="1777" class="class-name">Executor / MCP → Artifact → AgentEvent</text>
  <text x="1910" y="1824" class="body-green">输出：工具结果、原始 Artifact、证据引用、错误与耗时</text>
  <text x="1910" y="1861" class="body-green">新 Artifact 异步进入任务私有 RAG 索引，下一轮可检索</text>

  <path d="M1870 1795 H1740" class="flow-green"/><text x="1755" y="1770" class="edge-green">工具结果</text>
  <rect x="880" y="1690" width="860" height="205" class="card-blue"/>
  <text x="920" y="1744" class="node-title">回填对话与循环出口判定</text><text x="920" y="1777" class="class-name">Transcript + Session 状态机</text>
  <text x="920" y="1824" class="body">继续：未完成 / finish 被拒绝 → 下一轮重新选 Skill 与检索</text>
  <text x="920" y="1861" class="body">挂起或退出：暂停、待审批、blocked、完成、取消、失败</text>

  <path d="M880 1795 H720 V1635 H455 V1620" class="flow-green"/><text x="480" y="1665" class="edge-green">下一轮</text>
  <path d="M2280 1690 V1638 H3250 V635" class="flow-gray"/><text x="2720" y="1665" class="edge-gray">新增 Artifact：异步分块与向量化，不阻塞本轮</text>

  <!-- D. 持久化与前端 -->
  <rect x="100" y="2010" width="3800" height="380" class="frame-green"/>
  <text x="145" y="2068" class="lane-title-green">D. 持久化与前端可见性</text>
  <text x="145" y="2103" class="lane-note">除了现有策略、时间线和证据，建议增加 Skill 命中与 RAG 检索可观测信息，但不暴露未脱敏原文或模型内部推理。</text>

  <rect x="150" y="2150" width="820" height="175" class="card"/>
  <text x="190" y="2200" class="node-title">持久化审计</text>
  <text x="190" y="2244" class="body">保存：Skill ID/版本、激活原因、检索查询摘要</text>
  <text x="190" y="2281" class="body">来源引用、得分、过滤数量、Token 占用、耗时</text>

  <rect x="1040" y="2150" width="820" height="175" class="card-green"/>
  <text x="1080" y="2200" class="node-title-green">前端左栏：策略与 Skills</text>
  <text x="1080" y="2244" class="body-green">显示本任务已选 Skill、本轮激活 Skill、版本和步骤</text>
  <text x="1080" y="2281" class="body-green">Skill 只标识方法来源，不标识“已验证事实”</text>

  <rect x="1930" y="2150" width="820" height="175" class="card-green"/>
  <text x="1970" y="2200" class="node-title-green">前端中栏：检索与执行时间线</text>
  <text x="1970" y="2244" class="body-green">显示检索开始/结束、命中数、来源、上下文占用</text>
