<!doctype html>
<html lang="zh-CN" data-theme="tungsten" data-nav="rail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TGA3 Ops</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("tga3.ui.theme.v1");
          var legacy = { obsidian: "tungsten", daylight: "swiss", cyber: "instrument" };
          var t = legacy[raw] || raw;
          if (t !== "tungsten" && t !== "swiss" && t !== "spatial" && t !== "instrument") t = "tungsten";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t === "swiss" ? "light" : "dark";
          var nav = localStorage.getItem("tga3.ui.nav.v1");
          if (nav !== "rail" && nav !== "topbar") nav = "rail";
          document.documentElement.dataset.nav = nav;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
