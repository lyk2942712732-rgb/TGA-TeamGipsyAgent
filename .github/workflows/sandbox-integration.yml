name: sandbox-integration

on:
  pull_request:
    paths:
      - "tga/sandbox/**"
      - "sandboxd/**"
      - "config/sandbox.json"
      - "scripts/check_sandbox_host.sh"
      - "scripts/sandbox_integration_test.sh"
  workflow_dispatch:

jobs:
  linux-isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    environment: sandbox-integration
    runs-on: [self-hosted, linux, x64, tga-sandbox-integration]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated host baseline
        run: scripts/check_sandbox_host.sh
      - name: Run privileged isolation suite
        env:
          TGA_SANDBOX_INTEGRATION: "1"
        run: scripts/sandbox_integration_test.sh
      - name: Assert cleanup
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=tga.sandbox.managed=true)"
          test -z "$(docker network ls -q --filter label=tga.sandbox.managed=true)"
          if sudo nft list tables | grep -q 'table inet tga_'; then
            echo "TGA nftables tables remain after integration test" >&2
            exit 1
          fi
