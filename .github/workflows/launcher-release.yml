name: launcher-release

# Tagging `tga-v*` publishes everything a user needs to install TGA: the `tga`
# binaries, and the TGA-Runtime filesystem that `tga.exe` imports as its
# dedicated WSL2 distribution.
#
# The two ship in one release on purpose. The launcher has to fetch a runtime
# it can talk to, and pairing them by release tag means there is no version
# matrix to get wrong -- `tga` vX asks for the rootfs in its own release.
#
# Image releases use their own `sandbox-v*` tags, so neither trigger fires the
# other.
# Pull requests build the same artifacts without publishing them. That matters
# more than it sounds: building the rootfs runs provision.sh end to end on a
# clean system, which is the only place that script is ever fully exercised.
# Finding out at release time that it does not work is finding out too late.
on:
  push:
    tags:
      - "tga-v*"
  pull_request:
    paths:
      - ".github/workflows/launcher-release.yml"
      - "deploy/**"
      - "launcher/**"
      - "sandboxd/**"
      - "apps/web/**"
      - "tga/**"
      - "config/sandbox.json"
      - "pyproject.toml"

permissions:
  contents: write
  id-token: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # A pull request's ref name is "21/merge", which is not a filename.
          # Release runs take the tag; everything else gets a placeholder that
          # makes it obvious the artifact is not a release.
          if [[ "$GITHUB_REF" == refs/tags/tga-* ]]; then
            echo "value=${GITHUB_REF_NAME#tga-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          # The launcher depends only on the standard library and therefore
          # has no go.sum; the default cache key would look for one and fail.
          cache: false
      - name: Test the launcher
        working-directory: launcher
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
      - name: Cross-compile every target
        working-directory: launcher
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          version="$VERSION"
          # -trimpath keeps runner-local paths out of the binary, so the same
          # tag built twice produces the same bytes.
          while read -r os arch ext; do
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "../dist/tga-${version}-${os}-${arch}${ext}" \
              ./cmd/tga
          done <<'TARGETS'
          windows amd64 .exe
          linux amd64
          linux arm64
          TARGETS
      - name: Verify the stamp took
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # A silently unstamped build would ship as "dev" and nobody would
          # notice until a user asked the binary what it was.
          version="$VERSION"
          reported="$(dist/tga-${version}-linux-amd64 version)"
          test "$reported" = "tga launcher ${version}" || {
            echo "expected 'tga launcher ${version}', got '${reported}'" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-binaries
          path: dist/
          retention-days: 1

  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # A pull request's ref name is "21/merge", which is not a filename.
          # Release runs take the tag; everything else gets a placeholder that
          # makes it obvious the artifact is not a release.
          if [[ "$GITHUB_REF" == refs/tags/tga-* ]]; then
            echo "value=${GITHUB_REF_NAME#tga-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the committed lockfile was written by npm 11, and
          # npm 10 -- which is what Node 20 ships -- rejects it, demanding
          # optional platform entries that npm 11 no longer records. The
          # runners are deprecating Node 20 anyway.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the frontend bundle
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Resolve an immutable Ubuntu base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          echo "ubuntu=$(docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}')" \
            >> "$GITHUB_OUTPUT"
      - name: Build the runtime filesystem
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # This runs the very same provision.sh a Linux server runs, so the
          # distribution cannot drift from the server path: what breaks here
          # breaks there, in CI, before anyone downloads it.
          docker build \
            --build-arg UBUNTU_BASE="${{ steps.base.outputs.ubuntu }}" \
            --build-arg TGA_VERSION="$VERSION" \
            --tag tga-runtime:build \
            --file deploy/wsl-rootfs/Dockerfile \
            .
      - name: Check the filesystem before exporting it
        shell: bash
        run: |
          set -euo pipefail
          # Exporting a rootfs that is missing a piece produces a distribution
          # that imports cleanly and then fails on first use, which is a far
          # worse failure than a red build.
          while read -r path; do
            docker run --rm --entrypoint /bin/sh tga-runtime:build \
              -c "test -e '$path'" \
              || { echo "missing from the runtime filesystem: $path" >&2; exit 1; }
            echo "  ok  $path"
          done <<'PATHS'
          /opt/tga/bin/tga-internal
          /opt/tga/bin/tga-sandboxd
          /opt/tga/venv/bin/python
          /opt/tga/web/index.html
          /etc/tga/tga.env
          /etc/tga/sandbox.json
          /etc/systemd/system/tga-api.service
          /etc/systemd/system/tga-sandboxd.service
          /etc/systemd/system/multi-user.target.wants/tga-api.service
          /etc/systemd/system/multi-user.target.wants/tga-sandboxd.service
          /usr/local/bin/runsc
          /usr/bin/docker
          /etc/wsl.conf
          PATHS
      - name: Export it as a WSL tarball
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          version="$VERSION"
          mkdir -p dist
          container="$(docker create tga-runtime:build)"
          # `docker export` writes a filesystem tar, which is what `wsl --import`
          # consumes -- unlike `docker save`, which writes layers. Both sides of
          # the pipe are checked: a pipeline reports the exit status of its last
          # command, so an export that died mid-stream would otherwise look like
          # a successful compression of a truncated tarball.
          set -o pipefail
          docker export "$container" \
            | zstd -19 -T0 -q -o "dist/TGA-Runtime-${version}.tar.zst"
          docker rm "$container" >/dev/null
          ls -lh "dist/TGA-Runtime-${version}.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-rootfs
          path: dist/
          retention-days: 1

  publish:
    # Only a tag publishes. A pull request builds the same artifacts and stops,
    # which is the point: the build is the test, the release is not.
    if: startsWith(github.ref, 'refs/tags/tga-')
    needs: [launcher, rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect the artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv staging/*/* dist/
          ls -lh dist/
      - name: Checksum and sign
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tga-* TGA-Runtime-* > SHA256SUMS.txt
          for artifact in tga-* TGA-Runtime-* SHA256SUMS.txt; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE#tga-}"
          # Written to a file with a quoted heredoc so nothing in the markdown
          # -- backticks, backslashes, $ -- is interpreted by the shell; the
          # two values are substituted afterwards.
          cat > notes.md <<'NOTES'
          `tga` launcher `@VERSION@`, with the TGA-Runtime distribution.

          Download the binary for your platform, rename it to `tga`
          (`tga.exe` on Windows), and put it on your PATH. On first run,
          `tga up` imports `TGA-Runtime-@VERSION@.tar.zst` as its own WSL2
          distribution; Linux builds call the same runtime directly.

          The runtime already contains Python, the TGA package, the frontend
          bundle, Docker Engine, gVisor `runsc`, nftables, `tga-sandboxd` and
          the systemd units. Nothing is installed on first start.

          ### Verifying a download

          ```sh
          sha256sum --check --ignore-missing SHA256SUMS.txt

          cosign verify-blob \
            --certificate tga-@VERSION@-linux-amd64.pem \
            --signature tga-@VERSION@-linux-amd64.sig \
            --certificate-identity-regexp '^https://github.com/@REPOSITORY@/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            tga-@VERSION@-linux-amd64
          ```

          Kali Solver images ship separately under `sandbox-v*` tags and are
          pinned by digest in `config/sandbox.json`. `tga up --pull-images`
          fetches them; they are tens of gigabytes, so a first start does not.
          NOTES
          sed -i "s|@VERSION@|${version}|g; s|@REPOSITORY@|${REPOSITORY}|g" notes.md
          gh release create "$RELEASE" \
            --title "$version" \
            --notes-file notes.md \
            dist/*
