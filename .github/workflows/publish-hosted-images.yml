name: Publish hosted release images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tga3-hosted
            release: hosted-20261112
            sha256: fbfa69af70add54ef5460ff5d434528ed7b43cbfff39d71446b2e181c3808a75
            image_id: sha256:42d27090233781b2ed3f5c5c4dc7a088dab8b09e0a60ad027157a1e66dd71fd0
          - name: tga3-hosted-local-knowledge
            release: hosted-local-knowledge-20261112
            sha256: 1749a9e7968cdbdb1499800d872df2486d5ca6289104a73a78fbb96d8aff6e5a
            image_id: sha256:ec27b0b08998cac66c5915bf89f44964894e8fdf7edfb8b7090b89902cfd2f25
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_NAME: ${{ matrix.name }}
      RELEASE_TAG: ${{ matrix.release }}
      EXPECTED_SHA256: ${{ matrix.sha256 }}
      EXPECTED_IMAGE_ID: ${{ matrix.image_id }}
    steps:
      - name: Download and verify the released archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${IMAGE_NAME}-20261112-linux-amd64.tar"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          docker load --input "$RUNNER_TEMP/$archive"
          test "$(docker image inspect "$IMAGE_NAME:20261112" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Push to GitHub Container Registry
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME:20261112"
          docker tag "$IMAGE_NAME:20261112" "$target"
          docker push "$target"
          docker buildx imagetools inspect "$target"
          printf 'Published: %s\n' "$target" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: docker logout ghcr.io

