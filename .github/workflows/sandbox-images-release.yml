name: sandbox-images-release

on:
  push:
    tags:
      - "sandbox-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.0
      - uses: anchore/sbom-action/download-syft@v0
      - name: Resolve immutable Kali base
        id: base
        shell: bash
        run: |
          docker pull kalilinux/kali-rolling
          echo "kali=$(docker image inspect kalilinux/kali-rolling --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
      - name: Build and validate universal Solver image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg KALI_BASE="${{ steps.base.outputs.kali }}" \
            --tag tga-kali-base:release containers/kali/base
          while read -r image context; do
            docker build \
              --build-arg BASE_IMAGE=tga-kali-base:release \
              --tag "$image:release" \
              "containers/kali/$context"
            python scripts/validate_kali_image.py \
              --image "$image:release" --all-profiles
          done < <(python scripts/kali_build_matrix.py)
      - name: Publish, scan and record immutable digests
        shell: bash
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : > published-images.txt
          images=(tga-kali-base)
          while read -r image context; do
            images+=("$image")
          done < <(python scripts/kali_build_matrix.py)
          for local in "${images[@]}"; do
            remote="$REGISTRY/$local:$RELEASE"
            docker tag "$local:release" "$remote"
            docker push "$remote"
            digest="$(docker buildx imagetools inspect "$remote" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            immutable="${remote%:*}@$digest"
            trivy image --timeout 30m --exit-code 1 --ignore-unfixed --severity CRITICAL \
              --ignorefile .trivyignore "$immutable"
            name="$(basename "${remote%:*}")"
            syft "$immutable" -o "spdx-json=$name.spdx.json"
            printf '%s\n' "$immutable" >> published-images.txt
          done
      - name: Sign the published digests
        shell: bash
        run: |
          set -euo pipefail
          # Signing used to happen inside the publish loop, one ambient
          # credential lookup per image. GitHub mints ACTIONS_ID_TOKEN_REQUEST_TOKEN
          # per step, and it expires well inside a step that pushes and scans
          # many images: a later cosign call failed with "fetching ambient OIDC
          # credentials: invalid character 'u' looking for beginning of value"
          # -- the endpoint had answered "unauthorized" instead of JSON, seven
          # minutes into the step. Minting the Sigstore identity token once,
          # at the top of a step that does nothing else, keeps every signature
          # inside the token's lifetime.
          token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -er .value)"
          while read -r immutable; do
            cosign sign --yes --identity-token "$token" "$immutable"
          done < published-images.txt
      - name: Pin the published digests into sandbox.json
        shell: bash
        run: |
          set -euo pipefail
          # Publishing resolved every digest; without this step sandbox.json
          # keeps its placeholders and the release cannot actually be enforced.
          python scripts/resolve_sandbox_digests.py \
            --from-published published-images.txt
          python scripts/resolve_sandbox_digests.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-published-images
          path: |
            published-images.txt
            config/sandbox.json
            *.spdx.json
