name: sandbox-runtime

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox-runtime.yml"
      - "pyproject.toml"
      - "tga/sandbox/**"
      - "tga/runtime/scheduler.py"
      - "apps/api/main.py"
      - "sandboxd/**"
      - "containers/kali/**"
      - "config/sandbox.json"
      - "sandboxd/api/**"
      - "scripts/generate_sandbox_proto.py"
      - "scripts/kali_build_matrix.py"
      - "scripts/validate_kali_image.py"
      - "tests/test_capabilities.py"
      - "tests/test_nmap_mcp.py"
      - "tests/test_runtime_scheduler.py"
      - "tests/test_kali_images.py"
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/generate_sandbox_proto.py
      - run: git diff --exit-code -- tga/sandbox/api

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandboxd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: sandboxd/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install grpcio-tools==1.74.0
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: python -m grpc_tools.protoc -Iapi --go_out=api --go_opt=paths=source_relative --go-grpc_out=api --go-grpc_opt=paths=source_relative api/sandbox/v1/sandbox.proto
      - run: git diff --exit-code -- api
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/tga-sandboxd

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve immutable Kali base
        id: base
        shell: bash
        run: |
          docker pull kalilinux/kali-rolling
          echo "kali=$(docker image inspect kalilinux/kali-rolling --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
      - name: Build universal Solver image
        shell: bash
        run: |
          docker build \
            --build-arg KALI_BASE="${{ steps.base.outputs.kali }}" \
            --tag tga-kali-base:pr containers/kali/base
          while read -r image context; do
            docker build \
              --build-arg BASE_IMAGE=tga-kali-base:pr \
              --tag "$image:pr" \
              "containers/kali/$context"
          done < <(python scripts/kali_build_matrix.py)
      - name: Validate universal Solver image contract
        shell: bash
        run: |
          while read -r image context; do
            python scripts/validate_kali_image.py --image "$image:pr" --all-profiles
          done < <(python scripts/kali_build_matrix.py)
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.0
      - uses: anchore/sbom-action/download-syft@v0
      - name: Scan images and generate SBOMs
        shell: bash
        run: |
          images=(tga-kali-base:pr)
          while read -r image context; do
            images+=("$image:pr")
          done < <(python scripts/kali_build_matrix.py)
          for image in "${images[@]}"; do
            name="${image%%:*}"
            trivy image --timeout 30m --exit-code 1 --ignore-unfixed --severity CRITICAL \
              --ignorefile .trivyignore "$image"
            syft "$image" -o "spdx-json=$name.spdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-sboms
          path: "*.spdx.json"
