[project]
name = "tga-team-gipsy-agent"
version = "0.1.0"
description = "Team Gipsy Agent: authorized vulnerability review and CTF-solving MVP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "grpcio>=1.74",
    "httpx2==2.7.0",
    "mcp==2.0.0",
    "pydantic>=2.7",
    "protobuf>=6.31",
    "pywebview>=5.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.74.0",
    "pytest>=8.0",
]

[project.scripts]
tga = "tga.cli.main:main"

[tool.setuptools.packages.find]
include = ["tga*", "apps*"]
exclude = ["tests*", "docs*", "examples*", "scripts*", "runs*", "开发指导*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/integration holds privileged smoke scripts, not pytest tests. They are
# executed directly by scripts/sandbox_integration_test.sh on the dedicated
# runner. Collecting them here imports the sandbox providers before the rest of
# the suite, which changes import order and makes unrelated tests fail.
norecursedirs = ["tests/integration", "tests/fixtures", "tests/snapshots"]
