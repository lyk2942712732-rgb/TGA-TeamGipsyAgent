[project]
name = "tga-team-gipsy-agent"
version = "0.2.0"
description = "A LangChain/LangGraph competition agent for evidence-backed security tasks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "langchain>=1.3,<2",
    "langchain-openai>=1.2,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=1.24,<2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
tga = "tga2.cli:main"

[tool.setuptools.packages.find]
include = ["tga2*", "apps*"]
exclude = ["tests*", "examples*", "resources*", "runs*"]

[tool.setuptools.package-data]
tga2 = ["defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
