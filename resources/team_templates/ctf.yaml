{
  "mode": "ctf",
  "supervisor_definition_id": "ctf-supervisor",
  "required_solver_definition_ids": ["challenge-classifier"],
  "available_solver_definition_ids": ["challenge-classifier", "ctf-web-solver", "ctf-pwn-solver", "ctf-reverse-solver", "ctf-crypto-solver", "ctf-forensics-solver", "flag-verifier"],
  "reviewer_definition_id": "evidence-reviewer",
  "reporter_definition_id": "security-reporter",
  "spawn_rules": [
    {"trigger": "task_start", "definition_id": "ctf-supervisor", "max_instances": 1},
    {"trigger": "intent_ready", "definition_id": "challenge-classifier", "max_instances": 1},
    {"trigger": "review_required", "definition_id": "evidence-reviewer", "max_instances": 1},
    {"trigger": "report_required", "definition_id": "security-reporter", "max_instances": 1}
  ],
  "max_active_workers": 2,
  "max_total_solvers": 12,
  "completion_policy": {"supervisor_decides": true, "require_reviewer": true, "require_reporter": true, "require_all_required_intents_terminal": true}
}
