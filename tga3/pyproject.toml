[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tga3"
version = "0.1.0"
description = "Blackboard-first dual-agent runtime for Team Gipsy Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.24,<2",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
control = ["docker>=7.1,<8", "openai-agents>=0.13,<1", "claude-agent-sdk>=0.1,<1"]
worker-openai = ["openai-agents>=0.13,<1", "openai>=2,<3"]
worker-claude = ["claude-agent-sdk>=0.1,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12"]

[project.scripts]
tga3 = "tga3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
