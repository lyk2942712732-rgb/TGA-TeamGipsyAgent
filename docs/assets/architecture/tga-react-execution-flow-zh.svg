<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">TGA ReAct Agent 单轮执行与结果交付流程</title>
  <desc id="desc">展示用户任务如何进入 AgentToolSession，经过上下文组装、LLM function calling、受控执行、Artifact 与 AgentEvent 持久化、tool 结果回传、循环结束和最终结果交付。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f1f6ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#5d79b5" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L14 7 L0 14 Z" fill="#2369df"/>
    </marker>
    <marker id="arrowGray" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L14 7 L0 14 Z" fill="#8799bf"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L14 7 L0 14 Z" fill="#2e9a78"/>
    </marker>
    <style>
      .title { font: 700 52px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#252b63; letter-spacing:1px; }
      .subtitle { font: 400 22px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#7482a4; }
      .section { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#244ab5; }
      .sectionBlue { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#1760c7; }
      .sectionGreen { font: 700 25px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#267e64; }
      .boxTitle { font: 700 24px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#2d2e83; }
      .boxTitleBlue { font: 700 23px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#174fb9; }
      .body { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#34436e; }
      .bodySmall { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#5c6c98; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#7583a7; }
      .chipText { font: 600 14px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#304783; }
      .metric { font: 700 17px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#2a3f7a; }
      .note { font: 600 15px 'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#4865a3; }
      .frame { fill:url(#main); stroke:#c9d7f2; stroke-width:3; rx:26; }
      .frameViolet { fill:url(#violet); stroke:#d6d0f4; stroke-width:3; rx:26; }
      .card { fill:#ffffff; stroke:#d3def4; stroke-width:2; rx:18; filter:url(#shadow); }
      .cardViolet { fill:#fcfbff; stroke:#d8d0f6; stroke-width:2; rx:18; filter:url(#shadow); }
      .cardBlue { fill:#fafdff; stroke:#b8cff7; stroke-width:2; rx:18; filter:url(#shadow); }
      .cardGreen { fill:#fbfffd; stroke:#b8dfd1; stroke-width:2; rx:18; filter:url(#shadow); }
      .cardAmber { fill:#fffdf7; stroke:#e6d3a0; stroke-width:2; rx:18; filter:url(#shadow); }
      .pillBlue { fill:#edf4ff; stroke:#c9daf8; stroke-width:1.5; rx:10; }
      .pillViolet { fill:#f2efff; stroke:#d8d0f6; stroke-width:1.5; rx:10; }
      .pillGreen { fill:#eaf8f2; stroke:#bfdfd1; stroke-width:1.5; rx:10; }
      .pillAmber { fill:#fff7df; stroke:#ead69c; stroke-width:1.5; rx:10; }
      .divider { stroke:#dbe3f5; stroke-width:2; }
      .flow { fill:none; stroke:#2369df; stroke-width:5; marker-end:url(#arrow); }
      .flowGray { fill:none; stroke:#8799bf; stroke-width:4; marker-end:url(#arrowGray); }
      .flowGreen { fill:none; stroke:#2e9a78; stroke-width:4; marker-end:url(#arrowGreen); }
      .flowDash { fill:none; stroke:#8ea0c5; stroke-width:3; stroke-dasharray:11 9; marker-end:url(#arrowGray); }
      .iconBlue { fill:none; stroke:#2468d9; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .iconViolet { fill:none; stroke:#4c3abf; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .iconGreen { fill:none; stroke:#2e9a78; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .number { font:700 16px 'Segoe UI',sans-serif; fill:#fff; text-anchor:middle; dominant-baseline:central; }
      .mono { font:600 15px 'Segoe UI',Consolas,monospace; fill:#304783; }
    </style>
  </defs>

  <rect width="3840" height="2160" fill="url(#paper)"/>
  <text x="110" y="92" class="title">TGA ReAct Agent 执行效果图</text>
  <text x="114" y="134" class="subtitle">一轮任务如何进入模型、被谁执行、在哪里执行、如何回传，以及循环如何结束并交付结果</text>
  <g transform="translate(2660 58)">
    <rect width="1050" height="88" rx="18" fill="#f5f7ff" stroke="#d5def4" stroke-width="2"/>
    <circle cx="32" cy="30" r="7" fill="#2369df"/><text x="52" y="36" class="tiny">蓝色实线：主执行与回传</text>
    <circle cx="292" cy="30" r="7" fill="#4c3abf"/><text x="312" y="36" class="tiny">紫色：任务输入与生命周期</text>
    <circle cx="600" cy="30" r="7" fill="#2e9a78"/><text x="620" y="36" class="tiny">绿色：完成与结果交付</text>
    <line x1="32" y1="63" x2="82" y2="63" stroke="#8799bf" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="98" y="69" class="tiny">虚线：异步观察或只读投影</text>
  </g>

  <!-- Left: input and lifecycle -->
  <rect x="110" y="220" width="650" height="1660" class="frameViolet"/>
  <text x="435" y="274" text-anchor="middle" class="section">输入与生命周期</text>
  <text x="435" y="307" text-anchor="middle" class="tiny">用户只提交目标与控制意图，运行时负责执行</text>

  <rect x="148" y="340" width="574" height="260" class="card"/>
  <circle cx="202" cy="400" r="27" fill="#4c3abf"/>
  <path d="M186 397 H218 M190 411 H214" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="252" y="406" class="boxTitle">用户 / API 请求</text>
  <text x="180" y="460" class="bodySmall">任务目标、输入文件、Hint、模式</text>
  <text x="180" y="490" class="bodySmall">targets、授权范围、风险策略</text>
  <text x="180" y="520" class="bodySmall">launch / pause / resume / cancel</text>
  <rect x="180" y="548" width="230" height="30" class="pillViolet"/>
  <text x="295" y="569" text-anchor="middle" class="chipText">不直接触碰执行器</text>

  <rect x="148" y="650" width="574" height="280" class="cardViolet"/>
  <path d="M190 727 H244 M217 700 V754 M201 700 H233" class="iconViolet"/>
  <text x="274" y="713" class="boxTitle">Manager / Session 初始化</text>
  <text x="180" y="770" class="bodySmall">创建或恢复 Durable Session</text>
  <text x="180" y="800" class="bodySmall">选择产品主路径：AgentToolSession</text>
  <text x="180" y="830" class="bodySmall">绑定 solver_id、独立 workspace</text>
  <text x="180" y="860" class="bodySmall">加载 MCP catalog 快照与 Transcript</text>
  <rect x="180" y="880" width="220" height="30" class="pillBlue"/>
  <text x="290" y="901" text-anchor="middle" class="chipText">每个 Session 独立</text>

  <rect x="148" y="980" width="574" height="300" class="cardAmber"/>
  <path d="M190 1058 H244 M190 1080 H244 M190 1102 H230" class="iconViolet"/>
  <text x="274" y="1056" class="boxTitle">状态控制与退出</text>
  <text x="180" y="1110" class="bodySmall">运行中：继续 ReAct 循环</text>
  <text x="180" y="1142" class="bodySmall">暂停 / 取消：Session 状态阻止下一轮</text>
  <text x="180" y="1174" class="bodySmall">模型异常 / 轮次上限：blocked</text>
  <text x="180" y="1206" class="bodySmall">finish_session 通过：completed</text>
  <rect x="180" y="1230" width="420" height="30" class="pillAmber"/>
  <text x="390" y="1251" text-anchor="middle" class="chipText">停止由状态机与完成校验共同决定</text>

  <rect x="148" y="1330" width="574" height="430" class="card"/>
  <text x="180" y="1380" class="boxTitleBlue">最终结果从这里出去</text>
  <path d="M190 1432 H244 M190 1456 H244 M190 1480 H226" class="iconBlue"/>
  <text x="274" y="1440" class="bodySmall">GET /tasks/{id}/session</text>
  <text x="274" y="1472" class="bodySmall">GET /events 或 SSE stream</text>
  <text x="274" y="1504" class="bodySmall">Artifact 预览 / 检索 / 下载</text>
  <text x="180" y="1560" class="bodySmall">用户看到的不是模型原始幻觉，</text>
  <text x="180" y="1592" class="bodySmall">而是带证据引用的状态、事件、产物</text>
  <rect x="180" y="1630" width="250" height="42" class="pillGreen"/>
  <text x="305" y="1657" text-anchor="middle" class="chipText">report.md / UI 面板</text>
  <text x="180" y="1710" class="tiny">确认结论必须关联 task-owned Artifact</text>

  <!-- Main ReAct loop -->
  <rect x="840" y="220" width="2070" height="1660" class="frame"/>
  <text x="1875" y="274" text-anchor="middle" class="section">单轮 ReAct 主循环（产品主路径）</text>
  <text x="1875" y="307" text-anchor="middle" class="tiny">AgentToolSession.run：每次模型请求前重新组装受限工作上下文</text>

  <rect x="950" y="340" width="1650" height="220" class="cardBlue"/>
  <circle cx="1010" cy="394" r="18" fill="#2369df"/><text x="1010" y="394" class="number">1</text>
  <text x="1050" y="405" class="sectionBlue">本轮输入：Context Builder</text>
  <text x="1050" y="445" class="bodySmall">任务目标 / 模式配置 / 输入 Manifest / targets</text>
  <text x="1050" y="475" class="bodySmall">上一轮 Transcript / StrategyCard / Memory / Observer directive</text>
  <text x="1050" y="505" class="bodySmall">按需检索 Artifact 片段，不把完整原始数据塞进上下文</text>
  <rect x="2060" y="385" width="480" height="118" class="pillBlue"/>
  <text x="2300" y="420" text-anchor="middle" class="metric">受限工作上下文</text>
  <text x="2300" y="451" text-anchor="middle" class="tiny">token / 字符 / retrieval 次数可观测</text>
  <text x="2300" y="478" text-anchor="middle" class="tiny">敏感值不进入事件明文</text>

  <path d="M1775 560 V600" class="flow"/>
  <rect x="950" y="600" width="1650" height="230" class="card"/>
  <circle cx="1010" cy="654" r="18" fill="#2369df"/><text x="1010" y="654" class="number">2</text>
  <text x="1050" y="665" class="boxTitleBlue">LLM 决策：chat_tools / function calling</text>
  <text x="1050" y="705" class="bodySmall">输入：messages + 可用工具定义 + temperature=0.2</text>
  <text x="1050" y="737" class="bodySmall">输出：assistant content + tool_calls + finish_reason</text>
  <rect x="2050" y="645" width="500" height="132" class="pillViolet"/>
  <text x="2300" y="680" text-anchor="middle" class="metric">LLM 只做决策</text>
  <text x="2300" y="713" text-anchor="middle" class="tiny">不直接执行 Shell / HTTP / MCP</text>
  <text x="2300" y="744" text-anchor="middle" class="tiny">工具调用是“意图”，不是已完成事实</text>

  <path d="M1775 830 V870" class="flow"/>
  <rect x="950" y="870" width="1650" height="225" class="cardBlue"/>
  <circle cx="1010" cy="924" r="18" fill="#2369df"/><text x="1010" y="924" class="number">3</text>
  <text x="1050" y="935" class="sectionBlue">AgentToolSession：解析与路由</text>
  <text x="1050" y="975" class="bodySmall">解析 arguments 与 _tga 治理元数据，生成 ActionSpec</text>
  <text x="1050" y="1007" class="bodySmall">绑定 strategy_card / strategy_step / rationale / expected_outcome</text>
  <rect x="2020" y="915" width="190" height="100" class="pillBlue"/>
  <text x="2115" y="951" text-anchor="middle" class="chipText">能力工具</text><text x="2115" y="981" text-anchor="middle" class="tiny">tga_http / workspace</text>
  <rect x="2225" y="915" width="190" height="100" class="pillBlue"/>
  <text x="2320" y="951" text-anchor="middle" class="chipText">MCP 工具</text><text x="2320" y="981" text-anchor="middle" class="tiny">direct / gateway</text>
  <rect x="2430" y="915" width="120" height="100" class="pillAmber"/>
  <text x="2490" y="951" text-anchor="middle" class="chipText">完成</text><text x="2490" y="981" text-anchor="middle" class="tiny">finish</text>

  <path d="M1775 1095 V1135" class="flow"/>
  <rect x="950" y="1135" width="1650" height="310" class="cardAmber"/>
  <circle cx="1010" cy="1189" r="18" fill="#2369df"/><text x="1010" y="1189" class="number">4</text>
  <text x="1050" y="1200" class="boxTitle">执行层：先过门禁，再真正执行</text>
  <text x="1050" y="1238" class="bodySmall">Schema / scope / risk / TLS / rate / concurrency / timeout / semantic repeat</text>
  <rect x="1050" y="1270" width="470" height="135" class="card"/>
  <text x="1080" y="1308" class="boxTitleBlue">ControlledActionExecutor</text>
  <text x="1080" y="1340" class="bodySmall">TGA 进程内受控执行</text>
  <text x="1080" y="1372" class="tiny">HTTP、Workspace read/write、Python、Shell</text>
  <rect x="1565" y="1270" width="470" height="135" class="card"/>
  <text x="1595" y="1308" class="boxTitleBlue">MCPManager / MCPGateway</text>
  <text x="1595" y="1340" class="bodySmall">按 catalog 快照解析与授权</text>
  <text x="1595" y="1372" class="tiny">Docker STDIO 或 Remote HTTP/SSE</text>
  <rect x="2080" y="1270" width="470" height="135" class="card"/>
  <text x="2110" y="1308" class="boxTitleBlue">Input Tool Handler</text>
  <text x="2110" y="1340" class="bodySmall">只读/检索/物化输入</text>
  <text x="2110" y="1372" class="tiny">Immutable input + per-session workspace</text>

  <path d="M1775 1445 V1485" class="flow"/>
  <rect x="950" y="1485" width="1650" height="150" class="cardBlue"/>
  <circle cx="1010" cy="1539" r="18" fill="#2369df"/><text x="1010" y="1539" class="number">5</text>
  <text x="1050" y="1548" class="sectionBlue">结果固化：事实先落盘，再回给模型</text>
  <text x="1050" y="1581" class="bodySmall">ActionResult + Artifact（原始/截断/索引）+ AgentEvent seq + Strategy 更新</text>
  <rect x="2200" y="1514" width="350" height="78" class="pillBlue"/>
  <text x="2375" y="1547" text-anchor="middle" class="metric">可审计事实</text>
  <text x="2375" y="1575" text-anchor="middle" class="tiny">失败也落 Artifact 和事件</text>

  <path d="M1775 1635 V1660" class="flow"/>
  <rect x="950" y="1660" width="1650" height="170" class="card"/>
  <circle cx="1010" cy="1714" r="18" fill="#2369df"/><text x="1010" y="1714" class="number">6</text>
  <text x="1050" y="1723" class="boxTitleBlue">回传与收敛判定</text>
  <rect x="1050" y="1750" width="430" height="52" class="pillBlue"/>
  <text x="1265" y="1783" text-anchor="middle" class="chipText">tool message：受限 JSON / image block</text>
  <rect x="1520" y="1750" width="500" height="52" class="pillAmber"/>
  <text x="1770" y="1783" text-anchor="middle" class="chipText">finish_session 被拒：missing → 继续下一轮</text>
  <rect x="2060" y="1750" width="490" height="52" class="pillGreen"/>
  <text x="2305" y="1783" text-anchor="middle" class="chipText">finish_session 通过：terminal → completed</text>

  <!-- Loop line placed outside all cards, no crossing -->
  <path d="M900 1745 H855 V450 H950" class="flow"/>
  <text x="862" y="1100" transform="rotate(-90 862 1100)" class="note">继续下一轮：把 tool 结果追加到 messages，再次请求 LLM</text>
  <circle cx="825" cy="450" r="18" fill="#2369df"/><text x="825" y="450" class="number">7</text>

  <!-- External execution and provider -->
  <rect x="3010" y="220" width="720" height="1660" class="frame"/>
  <text x="3370" y="274" text-anchor="middle" class="section">外部边界与执行位置</text>
  <text x="3370" y="307" text-anchor="middle" class="tiny">模型、MCP 服务、授权目标都不属于 Agent 的直接权限</text>

  <rect x="3050" y="350" width="640" height="270" class="cardViolet"/>
  <circle cx="3110" cy="405" r="28" fill="#4c3abf"/>
  <path d="M3096 405 H3124 M3099 419 H3121" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="3160" y="410" class="boxTitle">LLM Provider</text>
  <text x="3080" y="466" class="bodySmall">OpenAI-compatible chat_tools API</text>
  <text x="3080" y="498" class="bodySmall">接收工作上下文，返回 function calling</text>
  <text x="3080" y="530" class="bodySmall">Token / 延迟 / provider error 可观测</text>
  <rect x="3080" y="558" width="250" height="34" class="pillViolet"/>
  <text x="3205" y="581" text-anchor="middle" class="chipText">不是执行环境</text>

  <rect x="3050" y="700" width="640" height="270" class="card"/>
  <path d="M3090 770 H3150 M3090 798 H3150 M3090 826 H3140" class="iconBlue"/>
  <text x="3180" y="775" class="boxTitleBlue">MCP 服务执行环境</text>
  <text x="3080" y="830" class="bodySmall">Docker STDIO：独立容器 / 挂载 /workspace</text>
  <text x="3080" y="862" class="bodySmall">Remote HTTP / SSE：外部 MCP 服务</text>
  <text x="3080" y="894" class="bodySmall">输出回到 MCPManager，再产出 Artifact</text>
  <rect x="3080" y="916" width="400" height="32" class="pillBlue"/>
  <text x="3280" y="938" text-anchor="middle" class="chipText">受 catalog 与 policy 限制</text>

  <rect x="3050" y="1050" width="640" height="270" class="card"/>
  <path d="M3090 1120 H3150 M3090 1148 H3150 M3090 1176 H3140" class="iconBlue"/>
  <text x="3180" y="1125" class="boxTitleBlue">授权目标 / 本地 Session Workspace</text>
  <text x="3080" y="1180" class="bodySmall">HTTP/HTTPS target：scope、TLS、速率、并发</text>
  <text x="3080" y="1212" class="bodySmall">Workspace：每个 solver 独立，可控读写</text>
  <text x="3080" y="1244" class="bodySmall">HTTP session：按 task / solver / origin 隔离</text>
  <rect x="3080" y="1266" width="430" height="32" class="pillBlue"/>
  <text x="3295" y="1288" text-anchor="middle" class="chipText">执行结果必须产物化</text>

  <rect x="3050" y="1400" width="640" height="380" class="cardAmber"/>
  <text x="3080" y="1450" class="boxTitle">停止条件与异常路径</text>
  <text x="3080" y="1495" class="bodySmall">1. finish_session 通过完成校验器</text>
  <text x="3080" y="1527" class="bodySmall">2. 用户 pause / cancel，下一轮不再进入</text>
  <text x="3080" y="1559" class="bodySmall">3. 模型请求失败、执行失败、策略拒绝</text>
  <text x="3080" y="1591" class="bodySmall">4. turn_count >= max_turns</text>
  <text x="3080" y="1638" class="tiny">完成校验失败不会结束：返回 missing 条件，</text>
  <text x="3080" y="1664" class="tiny">Session 追加 continuation message，重新决策。</text>
  <rect x="3080" y="1700" width="520" height="44" class="pillAmber"/>
  <text x="3340" y="1728" text-anchor="middle" class="chipText">completed / blocked / cancelled / paused</text>

  <!-- External arrows, each in its own horizontal lane -->
  <path d="M2600 690 H3050" class="flowGray"/>
  <text x="2750" y="672" class="tiny">请求 + tools</text>
  <path d="M3050 520 H2650" class="flowDash"/>
  <text x="2690" y="502" class="tiny">assistant tool_calls / content</text>
  <path d="M2600 1305 H3050" class="flowGray"/>
  <text x="2725" y="1287" class="tiny">授权后执行</text>
  <path d="M3050 860 H2650" class="flowDash"/>
  <text x="2675" y="842" class="tiny">MCP outcome</text>

  <!-- Green result delivery lane -->
  <path d="M2305 1830 V1940" class="flowGreen"/>
  <rect x="840" y="1940" width="2890" height="160" class="frame"/>
  <text x="900" y="1990" class="sectionGreen">7. 用户拿到最终结果</text>
