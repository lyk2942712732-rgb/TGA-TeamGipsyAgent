# WSL settings baked into the TGA-Runtime distribution.
#
# The user never edits this. `tga.exe` imports the distribution and talks to it
# through `wsl.exe -d TGA-Runtime -- …`; everything below exists so that the
# services this deployment installs actually come up.

[boot]
# Nothing works without this. tga-api.service and tga-sandboxd.service are
# systemd units, and a distribution booted with the default init would leave
# `tga up` supervising processes that were meant to be supervised by systemd.
systemd = true

[user]
# Commands arrive as root because provisioning, service control and sandboxd
# all require it. The API itself still runs as the unprivileged `tga` account
# under systemd -- this is the login default, not the account services use.
default = root

[interop]
# A Linux runtime has no reason to launch Windows executables, and leaving the
# Windows PATH appended pulls hundreds of host entries into every command this
# distribution runs.
enabled = false
appendWindowsPath = false

[automount]
# Task data must never land on /mnt/c: DrvFs has no real Linux permissions, so
# the sandbox could not enforce ownership on anything it wrote there. Windows
# drives stay mounted for file exchange, but nothing in TGA writes to them.
enabled = true
options = "metadata,umask=22,fmask=11"
